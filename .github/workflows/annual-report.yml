name: Annual report
on:
  schedule:
    - cron: '30 3 1 1 *'
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to report (blank = previous year)'
        required: false
        type: string
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Generate report
        env:
          REPORT_YEAR: ${{ inputs.year }}
        run: |
          if [ -n "$REPORT_YEAR" ]; then
            python scripts/content.py report --year "$REPORT_YEAR"
          else
            python scripts/content.py report
          fi
      - name: Save annual report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/
          git diff --cached --quiet || (git commit -m 'Generate annual concert report' && git push)
