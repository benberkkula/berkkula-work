name: Publish BK favicon PNG
on:
  push:
    paths:
      - '.github/workflows/publish-bk-favicon.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write PNG file
        shell: bash
        run: |
          mkdir -p assets
          echo '' | base64 --decode > assets/favicon-48x48.png
      - name: Commit PNG asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-48x48.png
          git diff --cached --quiet || (git commit -m "Add 48px PNG companion for BK favicon" && git push)
