name: Sync legacy portfolio PDF
on:
  push:
    paths:
      - '.github/workflows/sync-legacy-portfolio.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy PDF with current portfolio
        run: |
          cp "docs/Berk Kula  Portfolio.pdf" "docs/berk-kula-portfolio.pdf"
      - name: Commit updated legacy PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/berk-kula-portfolio.pdf
          git diff --cached --quiet || (git commit -m "Sync legacy portfolio URL with current PDF" && git push)
