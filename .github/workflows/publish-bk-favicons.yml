name: Publish approved BK favicon images
on:
  push:
    paths:
      - '.github/workflows/publish-bk-favicons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build favicon sizes from SVG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          from io import BytesIO
          from PIL import Image
          import cairosvg
          svg='assets/favicon.svg'
          raw=cairosvg.svg2png(url=svg,output_width=1024,output_height=1024)
          source=Image.open(BytesIO(raw)).convert('RGBA')
          for size in [16,32,48,180,192,512]:
              target=source.resize((size,size),Image.Resampling.LANCZOS)
              name={16:'favicon-16x16.png',32:'favicon-32x32.png',48:'favicon-48x48.png',180:'apple-touch-icon.png',192:'android-chrome-192x192.png',512:'android-chrome-512x512.png'}[size]
              target.save(('assets/' if size==48 else '')+name,optimize=True)
          source.save('favicon.ico',format='ICO',sizes=[(16,16),(32,32),(48,48)])
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-48x48.png favicon-16x16.png favicon-32x32.png favicon.ico apple-touch-icon.png android-chrome-192x192.png android-chrome-512x512.png
          git diff --cached --quiet || (git commit -m "Publish approved BK favicon files at all sizes" && git push)
