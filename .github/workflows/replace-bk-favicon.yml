name: Replace BK PNG favicon
on:
  push:
    paths:
      - '.github/workflows/replace-bk-favicon.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write corrected PNG file
        shell: bash
        run: |
          echo '' | base64 --decode > assets/favicon-48x48.png
      - name: Commit updated image
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicon-48x48.png
          git diff --cached --quiet || (git commit -m "Fix BK favicon clipping at small sizes" && git push)
